services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: fve
      POSTGRES_USER: fve
      POSTGRES_DB: fve
    ports: ["5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]

  docx-engine:
    build: ./packages/docx-engine
    ports: ["8100:8100"]
    volumes: ["./data:/data:ro"]

  web:
    build: ./apps/web
    env_file: .env
    depends_on: [db, docx-engine]
    ports: ["3000:3000"]

volumes:
  dbdata:
