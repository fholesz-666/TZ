services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: fve
      POSTGRES_USER: fve
      POSTGRES_DB: fve
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  docx-engine:
    build: ./packages/docx-engine
    ports: ["8100:8100"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    depends_on: [db, docx-engine]
    ports: ["3000:3000"]

volumes:
  dbdata:
